name: Monitor flooding

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD format).'
        required: false
        type: string
      stage:
        description: Whether to run the monitoring in dev/test mode, or "for real"
        type: choice
        options:
          - dev
          - prod
        default: dev

  schedule:
    - cron: '0 20 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Roboto font for plots
      run: sudo apt-get update -q && sudo apt-get install -y -q fonts-roboto

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.4'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
        python -m pip install -r requirements.txt

    - name: Run script
      env:
        DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
        DSCI_AZ_DB_DEV_PW_WRITE: ${{ secrets.DSCI_AZ_DB_DEV_PW_WRITE }}
        DSCI_AZ_DB_DEV_UID_WRITE: ${{ secrets.DSCI_AZ_DB_DEV_UID_WRITE }}
        DSCI_AZ_DB_DEV_PW: ${{ secrets.DSCI_AZ_DB_DEV_PW }}
        DSCI_AZ_DB_DEV_UID: ${{ secrets.DSCI_AZ_DB_DEV_UID }}
        DSCI_AZ_DB_DEV_HOST: ${{ secrets.DSCI_AZ_DB_DEV_HOST}}
        CDSAPI_KEY: ${{ secrets.CDSAPI_KEY}}
        CDSAPI_URL: ${{ secrets.CDSAPI_URL}}
        # org secret DSCI_LISTMONK_BASE_URL is not visible to this public repo;
        # the legacy DSCI_LISTMONK_API_URL org secret holds the same base URL
        DSCI_LISTMONK_BASE_URL: ${{ secrets.DSCI_LISTMONK_API_URL }}
        DSCI_LISTMONK_API_USERNAME: ${{ secrets.DSCI_LISTMONK_API_USERNAME}}
        DSCI_LISTMONK_API_KEY: ${{ secrets.DSCI_LISTMONK_API_KEY}}
        MONITORING_DATE: ${{ inputs.date || '' }}
        STAGE: ${{ inputs.stage || vars.STAGE || 'dev'}}

      run: |
        python pipelines/check_forecasts.py
        python pipelines/save_plots.py
        python pipelines/send_emails.py

    - name: Send failure mail
      if: failure()
      uses: dawidd6/action-send-mail@v2
      with:
        server_address: ${{ secrets.DSCI_AWS_EMAIL_HOST }}
        server_port: ${{ secrets.DSCI_AWS_EMAIL_PORT || 465 }}
        username: ${{ secrets.DSCI_AWS_EMAIL_USERNAME }}
        password: ${{ secrets.DSCI_AWS_EMAIL_PASSWORD }}
        subject: "Chad AA Flood Monitoring - FAILED"
        body: "GitHub Actions monitoring run for Chad AA flooding failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        to: zachary.arno@un.org,tristan.downing@un.org
        from: OCHA Centre for Humanitarian Data <data.science@humdata.org>
        content_type: text/html
