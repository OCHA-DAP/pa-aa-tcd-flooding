name: Monitor flooding

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD format).'
        required: false
        type: string
      stage:
        description: Whether to run the monitoring in dev/test mode, or "for real"
        type: choice
        options:
          - dev
          - prod
        default: dev
      test_email:
        description: Send only to the test recipient (Tristan) even when stage=prod
        type: boolean
        default: false

  schedule:
    - cron: '0 20 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Roboto font for plots
      run: sudo apt-get update -q && sudo apt-get install -y -q fonts-roboto

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.4'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
        python -m pip install -r requirements.txt

    - name: Run script
      env:
        DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
        DSCI_AZ_DB_DEV_PW_WRITE: ${{ secrets.DSCI_AZ_DB_DEV_PW_WRITE }}
        DSCI_AZ_DB_DEV_UID_WRITE: ${{ secrets.DSCI_AZ_DB_DEV_UID_WRITE }}
        DSCI_AZ_DB_DEV_PW: ${{ secrets.DSCI_AZ_DB_DEV_PW }}
        DSCI_AZ_DB_DEV_UID: ${{ secrets.DSCI_AZ_DB_DEV_UID }}
        DSCI_AZ_DB_DEV_HOST: ${{ secrets.DSCI_AZ_DB_DEV_HOST}}
        # Prod data-plane (STAGE=prod): the dev DB lost public network
        # access on 2026-09-22.
        DSCI_AZ_BLOB_PROD_SAS: ${{ secrets.DSCI_AZ_BLOB_PROD_SAS }}
        DSCI_AZ_BLOB_PROD_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_PROD_SAS_WRITE }}
        DSCI_AZ_DB_PROD_PW_WRITE: ${{ secrets.DSCI_AZ_DB_PROD_PW_WRITE }}
        DSCI_AZ_DB_PROD_UID_WRITE: ${{ secrets.DSCI_AZ_DB_PROD_UID_WRITE }}
        DSCI_AZ_DB_PROD_PW: ${{ secrets.DSCI_AZ_DB_PROD_PW }}
        DSCI_AZ_DB_PROD_UID: ${{ secrets.DSCI_AZ_DB_PROD_UID }}
        DSCI_AZ_DB_PROD_HOST: ${{ secrets.DSCI_AZ_DB_PROD_HOST }}
        # SES (direct SMTP) sender — TEMPORARY backend while Listmonk is down
        DSCI_AWS_EMAIL_HOST: ${{ secrets.DSCI_AWS_EMAIL_HOST }}
        DSCI_AWS_EMAIL_USERNAME: ${{ secrets.DSCI_AWS_EMAIL_USERNAME }}
        DSCI_AWS_EMAIL_PASSWORD: ${{ secrets.DSCI_AWS_EMAIL_PASSWORD }}
        DSCI_AWS_EMAIL_ADDRESS: ${{ secrets.DSCI_AWS_EMAIL_ADDRESS }}
        EMAIL_BACKEND: ses
        # TEMPORARY daily heartbeat email during the prod cutover
        ALWAYS_EMAIL: 'true'
        TEST_EMAIL: ${{ inputs.test_email || 'false' }}
        CDSAPI_KEY: ${{ secrets.CDSAPI_KEY}}
        CDSAPI_URL: ${{ secrets.CDSAPI_URL}}
        # org secret DSCI_LISTMONK_BASE_URL is not visible to this public repo;
        # the legacy DSCI_LISTMONK_API_URL org secret holds the same base URL
        DSCI_LISTMONK_BASE_URL: ${{ secrets.DSCI_LISTMONK_API_URL }}
        DSCI_LISTMONK_API_USERNAME: ${{ secrets.DSCI_LISTMONK_API_USERNAME}}
        DSCI_LISTMONK_API_KEY: ${{ secrets.DSCI_LISTMONK_API_KEY}}
        MONITORING_DATE: ${{ inputs.date || '' }}
        STAGE: ${{ inputs.stage || vars.STAGE || 'dev'}}

      run: |
        python pipelines/check_forecasts.py
        python pipelines/save_plots.py
        python pipelines/send_emails.py

    - name: Open issue on failure
      if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        existing=$(gh issue list --repo "${{ github.repository }}" --state open --label pipeline-failure --json number --jq '.[0].number')
        if [ -n "$existing" ]; then
          gh issue comment "$existing" --repo "${{ github.repository }}" --body "Monitoring failed again: $run_url"
        else
          gh issue create --repo "${{ github.repository }}" \
            --title "Monitoring pipeline failed" \
            --label pipeline-failure \
            --assignee zackarno \
            --body "The scheduled flood monitoring workflow failed: $run_url"
        fi
