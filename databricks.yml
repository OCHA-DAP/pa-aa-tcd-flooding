# Databricks Asset Bundle — pa-aa-tcd-flooding
#
# One scheduled job, tcd_flood_monitoring: the daily Chad riverine flood AA
# monitor (GloFAS at N'Djamena), 20:00 UTC — three chained tasks running the
# unchanged pipeline scripts, exactly the sequence the GitHub Actions
# workflow ran:
#     check_forecasts  pipelines/check_forecasts.py  EWDS → projects.pa_aa_tcd_flooding_monitoring
#     save_plots       pipelines/save_plots.py       DB → chart PNG in blob
#     send_emails      pipelines/send_emails.py      DB + blob → email (SES / Listmonk)
#
# Each task goes through databricks/run_task.py, which sets the run-mode env
# vars the code reads at import (STAGE = live-vs-test emailing, DATA_STAGE = ocha-stratus data plane, EMAIL_BACKEND,
# ALWAYS_EMAIL, TEST_EMAIL, MONITORING_DATE) and copies src/ + pipelines/ off
# the wsfs checkout before importing. DB/blob/CDS credentials are NOT here —
# the Job Compute policy injects DSCI_AZ_* and CDSAPI_KEY from the `dsci`
# secret scope; the SES + Listmonk sender creds (not in the policy) are added
# below via spark_env_vars.
#
# The policy fixes CDSAPI_URL to plain CDS; GloFAS lives on EWDS, so the
# wrapper overrides CDSAPI_URL in the script's environment (see tasks).
#
# The two dev/prod axes (KB infrastructure/databricks.md): the bundle TARGET
# says where the job runs (dev = paused, "[dev <user>]"-prefixed; prod = the
# live schedule), the `stage` variable says which data plane it touches.
#
#   databricks bundle validate -t dev  -p DEFAULT
#   databricks bundle deploy   -t dev  -p DEFAULT --var git_branch=my-branch   # feature test (paused)
#   databricks bundle run tcd_flood_monitoring -t dev -p DEFAULT \
#       --params stage=prod,test_email=true                                    # prod data, email to Tristan only
#   databricks bundle destroy  -t dev  -p DEFAULT
#   databricks bundle deploy   -t prod -p DEFAULT                              # the live job
#
# Code changes ship by pushing the branch (source: GIT); `bundle deploy` is
# only needed when the job config (schedule, params, libraries, cluster)
# changes.

bundle:
  name: pa-aa-tcd-flooding

variables:
  git_branch:
    description: Repo branch the job pulls the pipeline code from
    default: main
  stage:
    description: ocha-stratus data plane (dev | prod) — also live-vs-test emailing
    default: dev
  data_stage:
    description: ocha-stratus data plane (dev | prod) — DEV since 2026-09-25 (private endpoint from Databricks; prod has no projects schema yet); `stage` alone keeps meaning live-vs-test emailing
    default: dev
  email_backend:
    description: '"ses" (direct SMTP, TEMPORARY while Listmonk is down) or "listmonk"'
    default: ses
  always_email:
    description: '"true" = informational email every day (cutover heartbeat); "false" = activations / warnings / Mondays only'
    default: "true"
  test_email:
    description: '"true" = send only to the test recipient even when stage=prod; the prod target sets "false"'
    default: "true"

.git_source: &git_source
  git_url: https://github.com/OCHA-DAP/pa-aa-tcd-flooding.git
  git_provider: gitHub
  git_branch: ${var.git_branch}

# Job Compute policy (000C79D951EAF0D6): ephemeral single-worker cluster that
# injects DSCI_AZ_DB_*/DSCI_AZ_BLOB_* (dev + prod) and CDSAPI_KEY from the
# dsci secret scope. Email sender creds are not in the policy, so add them.
.cluster_spec: &cluster_spec
  policy_id: "000C79D951EAF0D6"
  apply_policy_default_values: true
  num_workers: 1
  spark_env_vars:
    DSCI_AWS_EMAIL_HOST: "{{secrets/dsci/DSCI_AWS_EMAIL_HOST}}"
    DSCI_AWS_EMAIL_USERNAME: "{{secrets/dsci/DSCI_AWS_EMAIL_USERNAME}}"
    DSCI_AWS_EMAIL_PASSWORD: "{{secrets/dsci/DSCI_AWS_EMAIL_PASSWORD}}"
    DSCI_AWS_EMAIL_ADDRESS: "{{secrets/dsci/DSCI_AWS_EMAIL_ADDRESS}}"
    DSCI_LISTMONK_BASE_URL: "{{secrets/dsci/DSCI_LISTMONK_BASE_URL}}"
    DSCI_LISTMONK_API_USERNAME: "{{secrets/dsci/DSCI_LISTMONK_API_USERNAME}}"
    DSCI_LISTMONK_API_KEY: "{{secrets/dsci/DSCI_LISTMONK_API_KEY}}"

# Pinned to requirements.txt where the repo pins. numpy/pandas are left to
# the Databricks runtime to avoid fighting its core scientific stack.
.libs: &libs
  - pypi: { package: "ocha_stratus==0.1.4" }
  - pypi: { package: "ocha-relay @ git+https://github.com/OCHA-DAP/ocha-relay.git@v0.3.0" }
  - pypi: { package: "cdsapi==0.7.6" }
  - pypi: { package: "cfgrib==0.9.14.0" }
  - pypi: { package: "eccodes==2.42.0" }
  - pypi: { package: "xarray==2025.6.1" }
  - pypi: { package: "rioxarray==0.19.0" }
  - pypi: { package: "netCDF4==1.6.5" }
  - pypi: { package: "dask==2025.5.1" }
  - pypi: { package: "geopandas==1.1.1" }
  - pypi: { package: "shapely" }
  - pypi: { package: "scipy==1.16.1" }
  - pypi: { package: "matplotlib==3.8.3" }
  - pypi: { package: "seaborn==0.13.2" }
  - pypi: { package: "Jinja2" }
  - pypi: { package: "pyarrow" }
  - pypi: { package: "python-dotenv" }
  - pypi: { package: "Requests==2.32.4" }
  - pypi: { package: "tqdm" }

resources:
  jobs:

    tcd_flood_monitoring:
      name: TCD Flood Monitoring
      description: >
        Daily Chad riverine flood AA monitor: GloFAS forecast at N'Djamena
        (EWDS) → projects.pa_aa_tcd_flooding_monitoring → chart → email.
        Replaces the GitHub Actions "Monitor flooding" cron.
      git_source: *git_source
      tags:
        databricks: job
        output_schema: projects

      permissions:
        - group_name: dsci
          level: CAN_MANAGE

      schedule:
        # 20:00 UTC daily (the GHA cron). No explicit pause_status: the prod
        # target runs it, the dev target (development mode) auto-pauses it.
        quartz_cron_expression: "0 0 20 * * ?"
        timezone_id: UTC

      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - tristan.downing@un.org

      parameters:
        - name: stage
          default: ${var.stage}
        - name: data_stage
          default: ${var.data_stage}
        - name: email_backend
          default: ${var.email_backend}
        - name: always_email
          default: ${var.always_email}
        - name: test_email
          default: ${var.test_email}
        - name: monitoring_date
          # YYYY-MM-DD; empty = today
          default: ""

      job_clusters:
        - job_cluster_key: main
          new_cluster: *cluster_spec

      tasks:
        - task_key: check_forecasts
          job_cluster_key: main
          libraries: *libs
          spark_python_task:
            python_file: databricks/run_task.py
            source: GIT
            parameters:
              - "pipelines/check_forecasts.py"
              - "--stage"
              - "{{job.parameters.stage}}"
              - "--env"
              - "DATA_STAGE={{job.parameters.data_stage}}"
              - "--env"
              - "EMAIL_BACKEND={{job.parameters.email_backend}}"
              - "--env"
              - "ALWAYS_EMAIL={{job.parameters.always_email}}"
              - "--env"
              - "TEST_EMAIL={{job.parameters.test_email}}"
              - "--env"
              - "MONITORING_DATE={{job.parameters.monitoring_date}}"
              # GloFAS is served by EWDS, not the plain CDS URL the policy fixes.
              - "--env"
              - "CDSAPI_URL=https://ewds.climate.copernicus.eu/api"

        - task_key: save_plots
          depends_on:
            - task_key: check_forecasts
          job_cluster_key: main
          libraries: *libs
          spark_python_task:
            python_file: databricks/run_task.py
            source: GIT
            parameters:
              - "pipelines/save_plots.py"
              - "--stage"
              - "{{job.parameters.stage}}"
              - "--env"
              - "DATA_STAGE={{job.parameters.data_stage}}"
              - "--env"
              - "EMAIL_BACKEND={{job.parameters.email_backend}}"
              - "--env"
              - "ALWAYS_EMAIL={{job.parameters.always_email}}"
              - "--env"
              - "TEST_EMAIL={{job.parameters.test_email}}"
              - "--env"
              - "MONITORING_DATE={{job.parameters.monitoring_date}}"
              # GloFAS is served by EWDS, not the plain CDS URL the policy fixes.
              - "--env"
              - "CDSAPI_URL=https://ewds.climate.copernicus.eu/api"

        - task_key: send_emails
          depends_on:
            - task_key: save_plots
          job_cluster_key: main
          libraries: *libs
          spark_python_task:
            python_file: databricks/run_task.py
            source: GIT
            parameters:
              - "pipelines/send_emails.py"
              - "--stage"
              - "{{job.parameters.stage}}"
              - "--env"
              - "DATA_STAGE={{job.parameters.data_stage}}"
              - "--env"
              - "EMAIL_BACKEND={{job.parameters.email_backend}}"
              - "--env"
              - "ALWAYS_EMAIL={{job.parameters.always_email}}"
              - "--env"
              - "TEST_EMAIL={{job.parameters.test_email}}"
              - "--env"
              - "MONITORING_DATE={{job.parameters.monitoring_date}}"
              # GloFAS is served by EWDS, not the plain CDS URL the policy fixes.
              - "--env"
              - "CDSAPI_URL=https://ewds.climate.copernicus.eu/api"

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: DEFAULT

  prod:
    mode: production
    workspace:
      profile: DEFAULT
      root_path: /Workspace/Users/adm.tdowning@global.un.org/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # TODO: replace with a service principal once one is provisioned
      user_name: adm.tdowning@global.un.org
    variables:
      stage: prod
      data_stage: dev
      test_email: "false"
